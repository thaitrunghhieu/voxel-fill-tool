<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>3D Voxel Fill Tool</title><link rel='stylesheet' href='./style.css'><script type='importmap'>{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body>
<div id='app'><aside><h1>3D VOXEL<br>FILL TOOL</h1><p class='sub'>Import a closed 3D mesh and fill its volume with cubes.</p><label class='drop' id='drop'>DROP MODEL HERE<input id='file' type='file' accept='.glb,.gltf,.obj,.stl,.fbx'><span>or click to choose<br>GLB / GLTF / OBJ / STL / FBX</span></label>
<div class='control'><div><b>Voxel size</b><output id='voxelOut'>0.25</output></div><input id='voxel' type='range' min='.05' max='1' value='.25' step='.01'></div>
<div class='control'><div><b>Cube scale</b><output id='scaleOut'>0.92</output></div><input id='cubeScale' type='range' min='.2' max='1' value='.92' step='.01'></div>
<div class='control'><b>Fill mode</b><select id='mode'><option value='solid'>Solid fill</option><option value='surface'>Surface only</option></select></div>
<label class='check'><input id='original' type='checkbox' checked> Show original mesh</label><label class='check'><input id='wire' type='checkbox'> Wireframe original</label>
<button id='voxelize' disabled>VOXELIZE</button><div class='control'><b>Export format</b><select id='exportFormat'><option value='glb'>GLB</option><option value='obj'>OBJ (for Maya → FBX)</option></select></div><button id='export' class='secondary' disabled>EXPORT</button><button id='reset' class='ghost'>RESET VIEW</button>
<div id='stats'>No model loaded.</div><div id='status'></div><p class='hint'>Best results: watertight / closed mesh. Smaller voxel size = more cubes and more processing.</p></aside><main id='viewport'><canvas id='canvas'></canvas><div class='badge'>LMB rotate · Wheel zoom · RMB pan</div></main></div><script type='module' src='./app.js'></script></body></html>
